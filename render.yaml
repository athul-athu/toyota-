services:
  - type: web
    name: toyota-server
    env: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn server.wsgi:application --bind 0.0.0.0:$PORT --timeout 90 --workers 1 --threads 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: server.settings
      - key: SECRET_KEY
        value: ${DJANGO_SECRET_KEY}
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      # Add in Render dashboard (Dashboard → Environment):
      # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_JWT_SECRET
      # FRONTEND_URL=https://toyota-livid.vercel.app (email confirmation redirect)
      # RESEND_API_KEY, RESEND_FROM (email on Render — SMTP port 587 is blocked)
      # Or SMTP_* for local-only testing
