services:
  - type: web
    name: toyota-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: server.settings
      - key: SECRET_KEY
        value: ${DJANGO_SECRET_KEY}
      - key: DATABASE_URL
        value: ${DATABASE_URL}
    plan: free
